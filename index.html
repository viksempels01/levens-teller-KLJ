<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Dieren Teller</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
    touch-action:manipulation;
}

body{
    background:#111;
    display:flex;
    flex-direction:column;
}

.grid{
    flex:1;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:6px;
    padding:6px;
}

.team{
    border:none;
    border-radius:18px;
    color:white;
    font-weight:bold;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    font-size:8vw;
    user-select:none;
}

.team:active{
    transform:scale(0.98);
}

.counter{
    font-size:18vw;
    margin-top:10px;
    line-height:1;
}

.yellow{
    background:#f4c20d;
    color:black;
}

.green{
    background:#2e7d32;
}

.blue{
    background:#1565c0;
}

.red{
    background:#c62828;
}

.bottom{
    padding:8px;
    background:#111;
    display:flex;
    gap:8px;
}

.bottom button{
    flex:1;
    border:none;
    border-radius:14px;
    padding:18px;
    font-size:5vw;
    font-weight:bold;
    color:white;
}

#endBtn{
    background:black;
    border:2px solid white;
}

#resetBtn{
    background:#666;
}

#resultaat{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.92);
    color:white;
    display:none;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:20px;
    font-size:7vw;
    z-index:10;
}

#resultBox{
    background:#222;
    padding:30px;
    border-radius:20px;
    width:100%;
    max-width:500px;
}

.closeBtn{
    margin-top:20px;
    background:white;
    color:black;
    border:none;
    border-radius:12px;
    padding:15px;
    font-size:5vw;
    width:100%;
}
</style>
</head>

<body>

<div class="grid">

    <button class="team yellow" id="btn0">
        HERTEN
        <div class="counter" id="count0">0</div>
    </button>

    <button class="team green" id="btn1">
        VOSSEN
        <div class="counter" id="count1">0</div>
    </button>

    <button class="team blue" id="btn2">
        LEEUWEN
        <div class="counter" id="count2">0</div>
    </button>

    <button class="team red" id="btn3">
        PANTERS
        <div class="counter" id="count3">0</div>
    </button>

</div>

<div class="bottom">
    <button id="endBtn">Einde</button>
    <button id="resetBtn">Reset</button>
</div>

<div id="resultaat">
    <div id="resultBox"></div>
</div>

<script>

document.addEventListener("gesturestart", function (e) {
    e.preventDefault();
});

let scores = [0,0,0,0];

const namen = [
    "Herten",
    "Vossen",
    "Leeuwen",
    "Panters"
];

function update(index){
    document.getElementById("count" + index).innerText = scores[index];
}

function add(index){
    scores[index]++;
    update(index);
}

document.getElementById("btn0").onclick = function(){ add(0); };
document.getElementById("btn1").onclick = function(){ add(1); };
document.getElementById("btn2").onclick = function(){ add(2); };
document.getElementById("btn3").onclick = function(){ add(3); };

document.getElementById("resetBtn").onclick = function(){

    scores = [0,0,0,0];

    for(let i=0;i<4;i++){
        update(i);
    }
};

document.getElementById("endBtn").onclick = function(){

    let lijst = [
        {naam:namen[0], score:scores[0]},
        {naam:namen[1], score:scores[1]},
        {naam:namen[2], score:scores[2]},
        {naam:namen[3], score:scores[3]}
    ];

    lijst.sort(function(a,b){
        return b.score - a.score;
    });

    let html = "<h2>Eindscore</h2><br>";

    for(let i=0;i<lijst.length;i++){
        html += (i+1) + ". " + lijst[i].naam + " - " + lijst[i].score + "<br><br>";
    }

    html += '<button class="closeBtn" onclick="sluitScore()">Sluiten</button>';

    document.getElementById("resultBox").innerHTML = html;
    document.getElementById("resultaat").style.display = "flex";
};

function sluitScore(){
    document.getElementById("resultaat").style.display = "none";
}

</script>

</body>
</html>
